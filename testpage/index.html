<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>BbgBridge – page de test</title>
<style>
  body { font: 14px system-ui, sans-serif; margin: 1.5rem; max-width: 1100px; }
  textarea { width: 100%; height: 9rem; font: 13px ui-monospace, monospace; }
  pre { background: #f4f4f4; padding: .6rem; max-height: 24rem; overflow: auto; font-size: 12px; }
  button { margin: .2rem .3rem .2rem 0; }
  table { border-collapse: collapse; margin-bottom: 1rem; }
  td, th { border: 1px solid #ccc; padding: .25rem .6rem; text-align: left; }
  #status.up { color: #087f23; font-weight: bold; }
  #status.down { color: #b00020; font-weight: bold; }
</style>
</head>
<body>
<h1>BbgBridge – page de test</h1>

<p>
  <input id="url" size="28" value="ws://127.0.0.1:8765/ws">
  <button id="connect">Connecter</button>
  <span id="status" class="down">déconnecté</span>
</p>

<p>
  Exemples :
  <button data-example="bdp">BDP</button>
  <button data-example="bds">BDS</button>
  <button data-example="bdh">BDH</button>
  <button data-example="subscribe">Subscribe</button>
  <button data-example="unsubscribe">Unsubscribe</button>
</p>
<textarea id="request" spellcheck="false"></textarea>
<p><button id="send">Envoyer</button></p>

<h2>Temps réel</h2>
<table>
  <thead><tr><th>Titre</th><th>Événement</th><th>Valeurs</th><th>Reçu à</th></tr></thead>
  <tbody id="live"></tbody>
</table>

<h2>Réponses</h2>
<pre id="log"></pre>

<script>
const $ = id => document.getElementById(id);
const yyyymmdd = date => date.toISOString().slice(0, 10).replaceAll("-", "");
const today = new Date();

const examples = {
  bdp: { id: "bdp", type: "ReferenceDataRequest", securities: ["IBM US Equity", "AAPL US Equity"], fields: ["PX_LAST", "NAME", "CRNCY"] },
  bds: { id: "bds", type: "ReferenceDataRequest", securities: ["IBM US Equity"], fields: ["DVD_HIST_ALL"] },
  bdh: { id: "bdh", type: "HistoricalDataRequest", securities: ["IBM US Equity"], fields: ["PX_LAST", "PX_VOLUME"],
         startDate: yyyymmdd(new Date(today - 14 * 86400000)), endDate: yyyymmdd(today) },
  subscribe: { id: "live", type: "Subscribe", securities: ["IBM US Equity", "EURUSD Curncy"], fields: ["LAST_PRICE", "BID", "ASK"] },
  unsubscribe: { id: "live", type: "Unsubscribe" },
};

let socket;
let liveFields = [];

function setStatus(connected, code) {
  $("status").textContent = connected ? "connecté" : "déconnecté" + (code ? ` (code ${code})` : "");
  $("status").className = connected ? "up" : "down";
}

function log(text) {
  $("log").textContent = `${new Date().toLocaleTimeString()}  ${text}\n\n${$("log").textContent.slice(0, 100000)}`;
}

function showReply(reply, size) {
  const text = JSON.stringify(reply, null, 2);
  log(`${(size / 1024).toFixed(1)} Ko\n${text.length > 20000 ? text.slice(0, 20000) + "\n…" : text}`);
}

function showPush(push) {
  const key = `${push.id}|${push.security}`;
  let row = [...$("live").rows].find(r => r.dataset.key === key);
  if (!row) {
    row = $("live").insertRow();
    row.dataset.key = key;
    for (let i = 0; i < 4; i++) row.insertCell();
  }
  const data = push.data ?? {};
  const shown = liveFields.filter(field => field in data);
  row.cells[0].textContent = push.security;
  row.cells[1].textContent = push.event;
  row.cells[2].textContent = shown.length
    ? shown.map(field => `${field} ${data[field]}`).join("   ")
    : JSON.stringify(push.data ?? "").slice(0, 200);
  row.cells[3].textContent = new Date().toLocaleTimeString();
}

function connect() {
  socket?.close();
  socket = new WebSocket($("url").value);
  socket.onopen = () => setStatus(true);
  socket.onclose = event => setStatus(false, event.code);
  socket.onerror = () => log("Connexion impossible : le pont tourne-t-il, et l'origine de cette page est-elle dans AllowedOrigins ?");
  socket.onmessage = event => {
    const message = JSON.parse(event.data);
    if (message.event) showPush(message);
    else showReply(message, event.data.length);
  };
}

$("connect").onclick = connect;

$("send").onclick = () => {
  if (socket?.readyState !== WebSocket.OPEN) {
    log("Pas connecté.");
    return;
  }
  const text = $("request").value;
  try {
    const request = JSON.parse(text);
    if (request.type === "Subscribe") liveFields = request.fields ?? [];
  } catch {
  }
  socket.send(text);
};

for (const button of document.querySelectorAll("[data-example]"))
  button.onclick = () => $("request").value = JSON.stringify(examples[button.dataset.example], null, 2);

$("request").value = JSON.stringify(examples.bdp, null, 2);
connect();
</script>
</body>
</html>
